<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="600"
     viewBox="0 0 900 600">

  <defs>

    <clipPath id="top">
      <rect x="0" y="0" width="900" height="180"/>
    </clipPath>

    <clipPath id="middle">
      <rect x="0" y="180" width="900" height="240"/>
    </clipPath>

    <clipPath id="bottom">
      <rect x="0" y="420" width="900" height="180"/>
    </clipPath>

  </defs>


  <rect width="900" height="600" fill="#050505"/>


  <!-- fragmento superior deslocado -->
  <image
    href="../melencolia.png"
    x="-25"
    y="0"
    width="900"
    height="600"
    clip-path="url(#top)"
  />


  <!-- parte central -->
  <image
    href="../melencolia.png"
    x="0"
    y="0"
    width="900"
    height="600"
    clip-path="url(#middle)"
  />


  <!-- fragmento inferior deslocado -->
  <image
    href="../melencolia.png"
    x="25"
    y="0"
    width="900"
    height="600"
    clip-path="url(#bottom)"
  />


  <!-- rachaduras -->
  <path d="M120 170 L180 220 L150 300 L230 360"
        stroke="white"
        stroke-width="2"
        opacity="0.35"
        fill="none"/>

  <path d="M700 350 L650 420 L720 500"
        stroke="white"
        stroke-width="2"
        opacity="0.25"
        fill="none"/>


  <!-- falhas digitais -->
  <rect x="0" y="178" width="900" height="3"
        fill="white" opacity="0.2"/>

  <rect x="0" y="418" width="900" height="3"
        fill="white" opacity="0.15"/>

</svg>
